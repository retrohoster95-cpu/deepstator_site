# Авторы издания. Ключ (например, richard-volkov) указывается в статье в поле `author:`.
# Можно указать и само имя — оно будет найдено по полю name.
# photo — файл из content/authors/: портрет, лучше вертикальный (4:5).
# focus — где на фото лицо, в процентах от ширины и высоты: по нему вырезается круглая аватарка.
# bio — необязательный короткий текст для страницы автора.
richard-volkov:
  name: Ричард Волков
  photo: richard-volkov.png
  focus: [42, 29]
