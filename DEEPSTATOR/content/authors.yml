# Авторы издания. Удобнее всего редактировать в админке: /admin/ → «Авторы».
# id — латиница, используется в адресе страницы автора (authors/<id>.html).
# В статье в поле `author:` указывается имя или id автора.
# photo — файл из content/authors/: портрет, лучше вертикальный (4:5) или PNG с прозрачным фоном.
# focus — где на фото лицо, в процентах от ширины и высоты: [x, y]. По нему вырезается круглая аватарка.
# role — подпись у портрета (по умолчанию «Автор DEEPSTATOR»). bio — необязательный короткий текст.
