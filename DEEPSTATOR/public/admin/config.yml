# Админка DEEPSTATOR (Sveltia CMS). Откройте https://<ваш сайт>/admin/
# Вход: «Sign In with Token» — персональный токен GitHub с доступом к репозиторию (см. README → «Админка»).
backend:
  name: github
  repo: retrohoster95-cpu/deepstator_site   # ← владелец/репозиторий на GitHub
  branch: main                              # ← ветка, из которой Render собирает сайт
  commit_messages:
    create: 'Новая статья: {{slug}}'
    update: 'Правка: {{slug}}'
    delete: 'Удалено: {{slug}}'
    uploadMedia: 'Картинка: {{path}}'
    deleteMedia: 'Удалена картинка: {{path}}'

locale: ru
site_url: https://deepstator.onrender.com
display_url: https://deepstator.onrender.com
logo_url: /favicon.svg

# картинки статей (обложки и иллюстрации) — сайт сам делает из них уменьшенные копии
media_folder: content/media
public_folder: /

output:
  omit_empty_optional_fields: true

collections:
  - name: articles
    label: Статьи
    label_singular: статью
    folder: content/articles
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: '{{fields.slug}}'
    identifier_field: title
    summary: '{{title}} — {{author}}'
    sortable_fields: [title, date, author, category]
    view_filters:
      - { label: Черновики, field: draft, pattern: true }
      - { label: Избранные, field: featured, pattern: true }
    editor:
      preview: false
    fields:
      - { name: title, label: Заголовок, widget: string }
      - name: slug
        label: Адрес статьи
        hint: 'Латиницей через дефис, например sotsialnyy-konflikt. Станет адресом: /articles/<адрес>.html. После публикации лучше не менять.'
        widget: string
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Только строчная латиница, цифры и дефис']
      - name: author
        label: Автор
        widget: relation
        collection: authors
        file: authors
        search_fields: ['authors.*.name']
        value_field: 'authors.*.name'
        display_fields: ['authors.*.name']
      - name: category
        label: Рубрика
        widget: select
        options: [Геополитика, Экономика, Общество, Философия и наука]
      - { name: tags, label: Теги, widget: list, required: false, hint: 'Через запятую' }
      - name: date
        label: Дата публикации
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        default: '{{now}}'
        required: false
        hint: 'Новые статьи сортируются по этой дате: самая свежая — первая.'
      - { name: draft, label: 'Черновик — не показывать на сайте', widget: boolean, default: false, required: false }
      - { name: featured, label: 'Избранное (может стать «Главным текстом»)', widget: boolean, default: false, required: false }
      - { name: subtitle, label: Подзаголовок, widget: string, required: false }
      - { name: excerpt, label: 'Краткое описание для карточки', widget: text, required: false, hint: 'Если пусто — берётся первый абзац.' }
      - { name: format, label: 'Формат', widget: string, required: false, hint: 'Например: Научная статья, Бонусная статья' }
      - { name: cover, label: Обложка, widget: image, required: false, hint: 'Широкая картинка, лучше от 1600 px в ширину.' }
      - { name: coverAlt, label: 'Описание обложки (для незрячих и поисковиков)', widget: string, required: false }
      - { name: coverColor, label: 'Обложка в цвете (иначе — монохром, цвет при наведении)', widget: boolean, default: false, required: false }
      - name: academic
        label: Научная шапка (УДК, ББК, аннотация)
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: udc, label: УДК, widget: string, required: false }
          - { name: bbk, label: ББК, widget: string, required: false }
          - { name: authorFull, label: 'ФИО полностью', widget: string, required: false }
          - { name: affiliation, label: 'Место работы / учёбы', widget: list, required: false }
          - { name: abstract, label: Аннотация, widget: text, required: false }
          - { name: keywords, label: Ключевые слова, widget: list, required: false }
          - name: en
            label: Английская версия
            widget: object
            required: false
            collapsed: true
            fields:
              - { name: title, label: Title, widget: string, required: false }
              - { name: abstract, label: Abstract, widget: text, required: false }
              - { name: keywords, label: Keywords, widget: list, required: false }
      - { name: language, label: Язык, widget: hidden, default: ru }
      - name: source
        label: Служебное (исходный файл)
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: file, label: Файл, widget: string, required: false }
          - { name: pdfTitle, label: Заголовок PDF, widget: string, required: false }
          - { name: fileDate, label: 'Дата файла (для сортировки, если нет даты публикации)', widget: string, required: false }
          - { name: pages, label: Страниц, widget: number, required: false }
      - name: body
        label: Текст
        widget: markdown
        modes: [raw, rich_text]
        hint: '## Подзаголовок — попадает в оглавление. > Цитата. [1] — ссылка на источник из раздела «## Список литературы» / «## Источники».'

  - name: authors
    label: Авторы
    editor:
      preview: false
    files:
      - name: authors
        label: Авторы
        file: content/authors.yml
        media_folder: /content/authors
        public_folder: /
        fields:
          - name: authors
            label: Авторы
            label_singular: автора
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Имя, widget: string }
              - name: id
                label: 'Адрес страницы автора'
                hint: 'Латиницей, например nikita-oganesyan → /authors/nikita-oganesyan.html'
                widget: string
                pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Только строчная латиница, цифры и дефис']
              - { name: role, label: 'Подпись у портрета', widget: string, required: false, hint: 'По умолчанию «Автор DEEPSTATOR»' }
              - { name: photo, label: Фото, widget: image, required: false, hint: 'Вертикальный портрет или PNG с прозрачным фоном.' }
              - name: focus
                label: 'Где лицо на фото, % [по ширине, по высоте]'
                hint: 'Например 50 и 35. По этой точке вырезается круглая аватарка.'
                widget: list
                required: false
                field: { name: v, label: '%', widget: number, value_type: int, min: 0, max: 100 }
              - { name: bio, label: 'О себе (необязательно)', widget: text, required: false }

  - name: pages
    label: Страницы
    editor:
      preview: false
    files:
      - name: about
        label: Об издании
        file: content/pages/about.md
        fields:
          - { name: lede, label: 'Вводная строка под заголовком', widget: string, required: false }
          - { name: body, label: Текст, widget: markdown, modes: [raw, rich_text], hint: 'Разделы начинаются с ## Заголовок' }
