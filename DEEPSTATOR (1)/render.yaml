services:
  - type: web
    name: deepstator
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Replace with your real address (e.g. https://deepstator.onrender.com or your domain)
      - key: SITE_URL
        value: https://deepstator.onrender.com
